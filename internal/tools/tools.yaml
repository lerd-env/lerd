# Pinned versions of the host tools lerd downloads. Embedded in the binary as
# the offline fallback and fetched from GitHub before each download, so a bad
# pin is fixable for every install here, without a binary release.
tools:
  composer:
    version: "2.11.2"
    url: https://getcomposer.org/download/{version}/composer.phar
  # mise is signed and notarized under a stable Developer ID, so macOS keeps a
  # Files and Folders grant across version bumps where fnm, which ships
  # unsigned, loses it on every pin (#1906). Only installed when the host has no
  # mise of its own.
  mise:
    version: v2026.11.8
    url: https://github.com/jdx/mise/releases/download/{version}/{asset}
    assets:
      linux/amd64: mise-{version}-linux-x64.tar.gz
      linux/arm64: mise-{version}-linux-arm64.tar.gz
      darwin/amd64: mise-{version}-macos-x64.tar.gz
      darwin/arm64: mise-{version}-macos-arm64.tar.gz
    digests:
      linux/amd64: d2d5a46f507bba772686e2c8f2316b3a4439dac49a37a30db5c0e7bb077c5431
      linux/arm64: b36da3c4892380325d44dee3678ba618de191254d8a4aed8011ee66b28a6cbd7
      darwin/amd64: 355729a12f3d3b23059ad372855a82f5c8720d1d3fb63dbe5068bc9b4952201c
      darwin/arm64: 7a7f9342559cc4ca670054337ecf497e69d832a05f66e531628381dc92b88f48
  fnm:
    version: v1.39.0
    url: https://github.com/Schniz/fnm/releases/download/{version}/{asset}
    assets:
      linux/amd64: fnm-linux.zip
      linux/arm64: fnm-arm64.zip
      darwin/amd64: fnm-macos.zip
      darwin/arm64: fnm-macos.zip
  # wp-cli for WordPress sites that never used composer. A framework names it in
  # vendor_bin_tools and lerd fetches it on the first `lerd wp`, never up front.
  # One phar for every platform, so every platform carries the same digest.
  wp-cli:
    version: "2.12.0"
    url: https://github.com/wp-cli/wp-cli/releases/download/v{version}/wp-cli-{version}.phar
    on_demand: true
    digests:
      linux/amd64: ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c
      linux/arm64: ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c
      darwin/amd64: ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c
      darwin/arm64: ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c
    sizes:
      linux/amd64: 7142777
      linux/arm64: 7142777
      darwin/amd64: 7142777
      darwin/arm64: 7142777
  # The PHP a host command falls back to when the runtime a project bundles is
  # short an extension it needs. Full static builds rather than trimmed ones, one
  # per PHP minor because the command runs a project's own code and its
  # composer.lock was resolved against that version. Kept out of Names() because
  # only a project that asks for one ever downloads it.
  php-host-8.3:
    version: "8.3.32"
    url: https://dl.static-php.dev/static-php-cli/common/{asset}
    assets:
      linux/amd64: php-{version}-cli-linux-x86_64.tar.gz
