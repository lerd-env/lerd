server {
    listen 80;
    listen [::]:80;
    server_name app.test *.app.test;
    return 302 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.test *.app.test;
    root "$TMP/002/public";
    index index.php index.html;

    ssl_certificate /etc/nginx/certs/app.test.crt;
    ssl_certificate_key /etc/nginx/certs/app.test.key;

    location ~ ^/app(/|$) {
        set $proxybackend "lerd-php84-fpm";
        proxy_pass http://$proxybackend:5180;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $fpm "lerd-php84-fpm";
        fastcgi_pass $fpm:9000;
        fastcgi_index index.php;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        include fastcgi_params;
        fastcgi_param HTTP_HOST $real_forwarded_host;
        fastcgi_param SERVER_NAME $real_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_HOST $real_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $real_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_PORT $real_forwarded_port;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param LERD_NGINX_SENT $msec;
        fastcgi_param HTTP_COOKIE "$http_cookie; SPX_KEY=$spx_key";
        fastcgi_param LERD_SITE app;
        include /etc/nginx/custom.d/app.test.location.conf*;
    }

    location ~ /\.ht {
        deny all;
    }

    include /etc/nginx/custom.d/app.test.conf*;
}
