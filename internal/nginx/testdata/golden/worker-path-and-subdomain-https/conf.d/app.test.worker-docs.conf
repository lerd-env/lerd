server {
    listen 80;
    listen [::]:80;
    server_name docs.app.test;
    return 302 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name docs.app.test;

    ssl_certificate /etc/nginx/certs/app.test.crt;
    ssl_certificate_key /etc/nginx/certs/app.test.key;

    location / {
        set $backend "lerd-php84-fpm";
        proxy_pass http://$backend:5180;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $real_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $real_forwarded_host;
        proxy_set_header X-Forwarded-Proto $real_forwarded_proto;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        include /etc/nginx/custom.d/docs.app.test.location.conf*;
    }

    include /etc/nginx/custom.d/docs.app.test.conf*;
}
