server {
    listen 80;
    listen [::]:80;
    server_name myapp.test *.myapp.test;

    location / {
        set $backend "lerd-custom-myapp";
        proxy_pass http://$backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $real_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $real_forwarded_host;
        proxy_set_header X-Forwarded-Proto $real_forwarded_proto;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        include /etc/nginx/custom.d/myapp.test.location.conf*;
    }

    include /etc/nginx/custom.d/myapp.test.conf*;
}
