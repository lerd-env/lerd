server {
    listen 80;
    listen [::]:80;
    server_name myapp.test *.myapp.test;
    root "$TMP/001/lerd/paused";
    location / {
        # Held requests are not the app's; the hold reports the activity itself.
        access_log off;
        # Without it nginx swaps only the matched "/" for the hold path, so a
        # deep link would reach lerd-ui as /_lerd/wake<path> and miss the hold.
        rewrite ^ /_lerd/wake? break;
        proxy_pass http://unix:$TMP/001/lerd/run/lerd-ui.sock:/_lerd/wake;
        proxy_http_version 1.1;
        proxy_set_header X-Lerd-Wake-Host $host;
        proxy_set_header X-Lerd-Wake-Uri $request_uri;
        proxy_set_header X-Lerd-Wake-Scheme $scheme;
        proxy_read_timeout 90s;
        proxy_intercept_errors on;
        error_page 502 504 599 = @waking;
    }
    location @waking {
        try_files /waking.html =503;
        default_type text/html;
    }
}
