server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root "$TMP/001/lerd/error-pages";
    location / {
        return 404;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
        default_type text/html;
    }
}
server {
    listen 443 default_server ssl;
    listen [::]:443 default_server ssl;
    ssl_reject_handshake on;
}
