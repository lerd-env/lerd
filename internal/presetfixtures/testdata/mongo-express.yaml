name: mongo-express
image: docker.io/library/mongo-express:latest
description: Mongo Express web UI for the lerd MongoDB service
ports:
  - "8082:8081"
environment:
  ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
  ME_CONFIG_BASICAUTH: "false"
dynamic_env:
  # {host} is the running/installed mongo family satisfier (lerd-mongo,
  # lerd-mongo-7, …) so a versioned engine is not stuck pointing at lerd-mongo.
  ME_CONFIG_MONGODB_URL: resolve_dep:mongo=mongodb://root:lerd@{host}:27017/?authSource=admin
depends_on:
  - mongo
dashboard: http://localhost:8082
category: admin
icon: leaf
admin_for:
  - mongo
