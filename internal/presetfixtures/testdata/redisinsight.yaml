name: redisinsight
image: docker.io/redis/redisinsight:latest
description: RedisInsight web UI for the lerd Redis service
ports:
  - "8085:5540"
environment:
  RI_APP_PORT: "5540"
  RI_REDIS_PORT: "6379"
dynamic_env:
  # Prefer a running redis-role satisfier so Valkey (or a versioned redis)
  # lands here instead of a hardcoded lerd-redis that may not exist.
  RI_REDIS_HOST: resolve_dep:redis
  RI_REDIS_ALIAS: resolve_dep:redis
depends_on:
  - redis
dashboard: http://localhost:8085
# RedisInsight sets first-run consent cookies the iframe can't carry across
# origins, so lerd-ui proxies it same-origin (see dashboard_external handling).
dashboard_external: true
category: admin
icon: database
admin_for:
  - redis
  - valkey
