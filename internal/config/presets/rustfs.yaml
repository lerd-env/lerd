name: rustfs
default: true
update_strategy: rolling
description: RustFS S3-compatible object storage
family: rustfs
image: docker.io/rustfs/rustfs:latest
ports:
  - "9000:9000"
  - "9001:9001"
data_dir: /data
exec: --console-enable /data
userns: keep-id:uid=10001,gid=10001
chown_data: true
dashboard: http://localhost:9001/rustfs/console/
# The console is a Next build rooted at /rustfs/console, so lerd serves it there
# rather than under /_svc/, and the /_svc/rustfs/ mount carries what it asks of
# the S3 root. Its requests are signed, and a signature covers the Host header,
# so the browser's own Host is forwarded rather than the upstream's.
dashboard_proxy_at_path: true
dashboard_proxy_strip: true
dashboard_proxy_reroute: true
dashboard_proxy_keep_host: true
# Lerd provisioned these keys, so the console opens on the bucket browser rather
# than on a form asking for them back.
dashboard_login:
  path: /rustfs/console/auth/login/
  fields:
    "#accessKey": RUSTFS_ACCESS_KEY
    "#secretKey": RUSTFS_SECRET_KEY
  submit: form button[type="submit"]
  done: auth.credentials
  # The console logs in through STS, so what it stores runs out; without this
  # the leftover key reads as a session and the form is never filled again.
  expires: Expiration
environment:
  RUSTFS_ACCESS_KEY: lerd
  RUSTFS_SECRET_KEY: lerdpassword
env_vars:
  - FILESYSTEM_DISK=s3
  - AWS_ACCESS_KEY_ID=lerd
  - AWS_SECRET_ACCESS_KEY=lerdpassword
  - AWS_DEFAULT_REGION=us-east-1
  - AWS_BUCKET=lerd
  - AWS_URL=http://localhost:9000
  - AWS_ENDPOINT=http://lerd-rustfs:9000
  - AWS_USE_PATH_STYLE_ENDPOINT=true
category: storage
icon: storage
color: "#0196d0"
introspect:
  entities:
    - kind: buckets
      label: Buckets
      driver: s3
      env:
        - S3_PORT=9000
        - S3_ACCESS_KEY=lerd
        - S3_SECRET_KEY=lerdpassword
      owner_env: AWS_BUCKET
      # The console's own address for one bucket, so a card opens the bucket
      # rather than the bucket list.
      dashboard_link: browser/?bucket={{name}}
      columns:
        - key: objects
          label: Objects
          format: number
        - key: size
          label: Size
          format: bytes
      actions:
        create:
        delete:
          destructive: true
        # The archive actions run a client image: streaming a bucket as one
        # file needs tar, which the S3 API has no equivalent of.
        export:
          exec: >
            mkdir -p /tmp/b && rclone copy -q :s3:{{name}} /tmp/b &&
            tar -C /tmp/b -czf - .
          filename: "{{name}}.tar.gz"
          image: docker.io/rclone/rclone:latest
          env:
            - RCLONE_S3_PROVIDER=Minio
            - RCLONE_S3_ENDPOINT=http://lerd-rustfs:9000
            - RCLONE_S3_ACCESS_KEY_ID=lerd
            - RCLONE_S3_SECRET_ACCESS_KEY=lerdpassword
        import:
          exec: >
            mkdir -p /tmp/b && tar -xf - -C /tmp/b &&
            rclone copy -q /tmp/b :s3:{{name}}
          image: docker.io/rclone/rclone:latest
          env:
            - RCLONE_S3_PROVIDER=Minio
            - RCLONE_S3_ENDPOINT=http://lerd-rustfs:9000
            - RCLONE_S3_ACCESS_KEY_ID=lerd
            - RCLONE_S3_SECRET_ACCESS_KEY=lerdpassword

# The app and the browser must agree on one hostname before a presigned URL is
# signed, so this service is served on rustfs.test rather than only at its
# container name. Remove it with: lerd service domain rustfs --remove
domain: rustfs
# A presigned upload is issued by the app but sent by the browser, which asks
# before it sends and gives up if the answer does not name the page's origin.
# Turn it off with: lerd service domain rustfs --no-cors
domain_cors: true
