name: mailpit
default: true
update_strategy: rolling
description: Mailpit SMTP catcher
family: mailpit
image: docker.io/axllent/mailpit:latest
ports:
  - "1025:1025"
  - "8025:8025"
data_dir: /data
dashboard: http://localhost:8025
# Embedded same-origin so the dashboard can theme it; Mailpit has no setting for
# a mount path, and giving it one through MP_WEBROOT would leave localhost:8025
# answering nothing, which is the URL every framework's mail docs hand people.
dashboard_proxy_strip: true
dashboard_proxy_rebase:
  - data-webroot
environment:
  MP_DATA_FILE: /data/mailpit.db
  MP_WEBHOOK_URL: http://host.containers.internal:7073/api/webhooks/mailpit
dynamic_env:
  # Scores every caught message once the spamassassin preset is installed, and
  # drops the variable again when it is not, which is how mailpit reads "off".
  MP_ENABLE_SPAMASSASSIN: discover_first:spamassassin={host}:783
env_vars:
  - MAIL_MAILER=smtp
  - MAIL_HOST=lerd-mailpit
  - MAIL_PORT=1025
  - MAIL_USERNAME=null
  - MAIL_PASSWORD=null
  - MAIL_ENCRYPTION=null
category: mail
icon: mail
color: "#00b786"

# The web UI, not the SMTP port a domain would otherwise land on.
domain_port: 8025
