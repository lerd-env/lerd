name: postgres
default: true
update_strategy: minor
track_latest: true
description: PostgreSQL with PostGIS
family: postgres
default_version: "16"
versions:
  - tag: "18"
    label: "18"
    image: docker.io/postgis/postgis:18-3.6-alpine
    host_port: 5432
  - tag: "17"
    label: "17"
    image: docker.io/postgis/postgis:17-3.6-alpine
    host_port: 5432
  - tag: "16"
    label: "16 (default)"
    image: docker.io/postgis/postgis:16-3.5-alpine
    canonical: true
    host_port: 5432
ports:
  - "{{host_port}}:5432"
data_dir: /var/lib/postgresql/data
data_version_file: PG_VERSION
environment:
  POSTGRES_PASSWORD: lerd
  POSTGRES_DB: lerd
  PGDATA: /var/lib/postgresql/data
env_vars:
  - DB_CONNECTION=pgsql
  - DB_HOST=lerd-{{name}}
  - DB_PORT=5432
  - DB_DATABASE=lerd
  - DB_USERNAME=postgres
  - DB_PASSWORD=lerd
connection_url: postgresql://postgres:lerd@127.0.0.1:{{host_port}}/lerd
client_shims:
  - psql
  - pg_dump
  - pg_dumpall
  - pg_restore
category: databases
icon: elephant
introspect:
  entities:
    - kind: databases
      format: sql
      list: >
        psql -U postgres -tAc
        "SELECT datname || chr(9) || GREATEST(pg_database_size(datname)
        - (SELECT pg_database_size('template1')), 0) FROM pg_database
        WHERE datistemplate = false AND datname <> 'postgres' ORDER BY datname"
      columns:
        - key: size
          label: Size
          format: bytes
      actions:
        create: psql -U postgres -c 'CREATE DATABASE "{{name}}";'
        drop:
          exec: psql -U postgres -c 'DROP DATABASE IF EXISTS "{{name}}" WITH (FORCE);'
          destructive: true
        export:
          exec: pg_dump -U postgres --clean --if-exists {{name}}
          filename: "{{name}}.sql"
        import: psql -U postgres -d {{name}}
        export_all: pg_dumpall -U postgres --clean --if-exists
        import_all: psql -U postgres -d postgres
extensions:
  - name: postgis
    types: [geometry, geography]
  - name: postgis_raster
    types: [raster]
  - name: postgis_topology
    types: [topogeometry]
