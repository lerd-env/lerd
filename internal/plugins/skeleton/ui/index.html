<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hello</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 2rem; color: #ddd; background: transparent; }
    @media (prefers-color-scheme: light) { body { color: #222; } }
    input, button { font: inherit; padding: .4rem .6rem; }
  </style>
</head>
<body>
  <h1>Hello</h1>
  <p>This page lives in the plugin's <code>ui/</code> folder and talks to its own <code>api</code> endpoint.</p>
  <form id="f"><input id="site" placeholder="site name" required> <button>Greet</button></form>
  <pre id="out"></pre>
  <script src="lerd.js"></script>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const site = document.getElementById('site').value;
      const out = document.getElementById('out');
      try {
        out.textContent = await lerd.api('greet?site=' + encodeURIComponent(site));
      } catch (err) {
        out.textContent = err.message;
      }
    });
  </script>
</body>
</html>
