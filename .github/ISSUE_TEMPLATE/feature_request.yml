name: Feature request
description: Suggest something lerd should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How you picture lerd solving it.
  - type: textarea
    id: workaround
    attributes:
      label: What you do now
      description: Any workaround you use in the meantime.
