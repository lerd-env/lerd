name: Bug report
description: Something in lerd does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. lerd link
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: lerd version
      description: Output of `lerd --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows (WSL2)
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distro and version
      placeholder: Fedora 43, Ubuntu 26.04, macOS 26...
  - type: textarea
    id: doctor
    attributes:
      label: lerd doctor output
      description: Output of `lerd doctor`, plus any error or log lines. Remove anything private.
      render: text
