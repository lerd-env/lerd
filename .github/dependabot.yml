version: 2

# One grouped pull request per ecosystem a week keeps the noise down. Majors
# stay out of the group and arrive one per pull request, since each can need
# code changes and would otherwise hold back every safe bump with it.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories: ["/internal/ui/web", "/docs"]
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  # The composite action is listed too, since "/" only covers workflows.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/go-job"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
