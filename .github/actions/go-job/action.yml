name: Go job setup
description: Go toolchain, a build and test cache of the job's own, the built UI, and on Linux the tray headers.

inputs:
  tray-deps:
    description: Install the libayatana headers the CGO tray build needs.
    default: "false"

outputs:
  cache-key:
    description: Key to save the Go cache under at the end of the job.
    value: ${{ steps.key.outputs.key }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
        cache: false

    - name: Point the Go caches at a known path
      shell: bash
      run: |
        echo "GOCACHE=$RUNNER_TEMP/go-build" >> "$GITHUB_ENV"
        echo "GOMODCACHE=$RUNNER_TEMP/go-mod" >> "$GITHUB_ENV"

    # One cache per job: race builds differ from plain ones, and a shared key
    # lets only the first job to finish save. The sha keeps it fresh per commit.
    - id: key
      shell: bash
      run: echo "key=go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"

    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ${{ env.GOCACHE }}
          ${{ env.GOMODCACHE }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
          go-${{ runner.os }}-${{ github.job }}-

    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ui-dist
        path: internal/ui/web/dist

    - if: inputs.tray-deps == 'true'
      uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
      with:
        packages: libayatana-appindicator3-dev
        version: "1.0"

    # The cache action reports success when its install fails, and caches nothing,
    # so every later run on the ref restores no packages. Install for real then,
    # after refreshing the index whose stale entries are what made it fail.
    - if: inputs.tray-deps == 'true'
      shell: bash
      run: |
        if ! pkg-config --exists ayatana-appindicator3-0.1; then
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev
        fi
        pkg-config --exists ayatana-appindicator3-0.1

    # A cache hit untars the libraries without refreshing ld.so.cache, and the
    # tray's dependency check resolves through ldconfig -p.
    - if: inputs.tray-deps == 'true'
      shell: bash
      run: sudo ldconfig
