name: Release

on:
  push:
    tags:
      - "v*"
  # A dry run from any branch: the same build, signing and provenance as a
  # tagged release, then the signature verified, with nothing published.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/ui/web/package-lock.json

      - name: Build UI
        run: make build-ui

      - name: Install tray build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing libayatana-appindicator3-dev

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: CGO_ENABLED=1 go build -o /dev/null ./cmd/lerd

      - name: Test
        run: CGO_ENABLED=1 go test ./...

      - name: Vet
        run: CGO_ENABLED=1 go vet ./...

      - name: Format
        run: test -z "$(gofmt -l .)"

  build-darwin-tray:
    name: Build macOS tray (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build lerd-tray
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir -p dist/lerd-tray_darwin_${{ matrix.arch }}
          CGO_ENABLED=1 go build \
            -ldflags="-s -w \
              -X github.com/geodro/lerd/internal/version.Version=${VERSION} \
              -X github.com/geodro/lerd/internal/version.Commit=${COMMIT} \
              -X github.com/geodro/lerd/internal/version.Date=${DATE}" \
            -o dist/lerd-tray_darwin_${{ matrix.arch }}/lerd-tray \
            ./cmd/lerd-tray

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lerd-tray-darwin-${{ matrix.arch }}
          path: dist/lerd-tray_darwin_${{ matrix.arch }}/lerd-tray
          retention-days: 1

  release:
    name: GoReleaser
    needs: [ci, build-darwin-tray]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless signing and the provenance attestation both prove their origin
      # with the workflow's OIDC token.
      id-token: write
      attestations: write
      # SignPath reads the unsigned artifact and the job that made it.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history for changelog generation

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/ui/web/package-lock.json

      - name: Build UI
        run: make build-ui

      - name: Install tray build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing libayatana-appindicator3-dev

      # By name into the folder .goreleaser.yml reads: download-artifact 5 and
      # later unpack a single pattern match straight into path, with no folder.
      - name: Download macOS tray binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lerd-tray-darwin-arm64
          path: dist-tray/lerd-tray-darwin-arm64

      - name: Build lerd.exe
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [ "$GITHUB_REF_TYPE" != tag ]; then VERSION=$(git describe --tags --abbrev=0); VERSION=${VERSION#v}; fi
          echo "WINDOWS_VERSION=$VERSION" >> "$GITHUB_ENV"
          .github/scripts/build-windows.sh "$VERSION"

      # Only dry runs are signed until the production certificate is in place,
      # since the test certificate is not trusted by Windows.
      - name: Upload lerd.exe for signing
        if: github.event_name == 'workflow_dispatch'
        id: upload-unsigned-windows
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lerd-windows
          path: dist-windows/
          retention-days: 1

      - name: Sign lerd.exe
        if: github.event_name == 'workflow_dispatch'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 7fdff4ab-f2a1-4324-8031-17f1fe061341
          project-slug: lerd
          signing-policy-slug: test-signing
          artifact-configuration-slug: lerd-exe
          github-artifact-id: ${{ steps.upload-unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-windows-signed
          parameters: |
            version: ${{ toJSON(env.WINDOWS_VERSION) }}

      - name: Use the signed lerd.exe
        if: github.event_name == 'workflow_dispatch'
        run: |
          rm -r dist-windows
          mv dist-windows-signed dist-windows

      # The previous tag is taken literally, and before a stable release stands
      # the last beta of its own cycle, so the notes would cover the beta run
      # rather than the release. A beta keeps the default: what came before it
      # is what its testers last had.
      - name: Compare a stable release against the last stable tag
        if: ${{ !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-rc') }}
        run: |
          # Version sort puts a prerelease above the release it belongs to, so
          # the previous stable is the first tag carrying no dash that is not
          # this one, rather than whatever sits in second place.
          previous=$(git tag -l 'v*' --sort=-v:refname | awk -v t="${{ github.ref_name }}" '!/-/ && $0 != t' | head -1)
          if [ -n "$previous" ]; then
            echo "Comparing ${{ github.ref_name }} against $previous"
            echo "GORELEASER_PREVIOUS_TAG=$previous" >> "$GITHUB_ENV"
          fi

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ github.event_name == 'workflow_dispatch' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Provenance for every archive the checksums list, recorded with GitHub and
      # attached to the release so it travels with the files it describes.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Verify the signature the way the docs tell users to
        run: |
          cosign verify-blob dist/checksums.txt \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity-regexp '^https://github.com/lerd-env/lerd/\.github/workflows/release\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Verify the archived lerd.exe is signed
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get install -y osslsigncode
          for archive in dist/lerd_*_linux_*.tar.gz; do
            tar -xzf "$archive" -O lerd.exe > lerd.exe
            osslsigncode extract-signature -in lerd.exe -out lerd.exe.p7
            echo "$archive:"
            openssl pkcs7 -inform DER -in lerd.exe.p7 -print_certs -noout
            rm lerd.exe lerd.exe.p7
          done

      - name: Attach the provenance to the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "dist/lerd_${GITHUB_REF_NAME#v}.intoto.jsonl"
          gh release upload "$GITHUB_REF_NAME" "dist/lerd_${GITHUB_REF_NAME#v}.intoto.jsonl" --clobber

      - name: Announce on Discord
        if: github.event_name == 'push'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: .github/scripts/discord-release.sh "${{ github.ref_name }}"
