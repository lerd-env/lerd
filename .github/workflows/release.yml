name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/ui/web/package-lock.json

      - name: Build UI
        run: make build-ui

      - name: Install tray build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing libayatana-appindicator3-dev

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: CGO_ENABLED=1 go build -o /dev/null ./cmd/lerd

      - name: Test
        run: CGO_ENABLED=1 go test ./...

      - name: Vet
        run: CGO_ENABLED=1 go vet ./...

      - name: Format
        run: test -z "$(gofmt -l .)"

  build-darwin-tray:
    name: Build macOS tray (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build lerd-tray
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir -p dist/lerd-tray_darwin_${{ matrix.arch }}
          CGO_ENABLED=1 go build \
            -ldflags="-s -w \
              -X github.com/geodro/lerd/internal/version.Version=${VERSION} \
              -X github.com/geodro/lerd/internal/version.Commit=${COMMIT} \
              -X github.com/geodro/lerd/internal/version.Date=${DATE}" \
            -o dist/lerd-tray_darwin_${{ matrix.arch }}/lerd-tray \
            ./cmd/lerd-tray

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lerd-tray-darwin-${{ matrix.arch }}
          path: dist/lerd-tray_darwin_${{ matrix.arch }}/lerd-tray
          retention-days: 1

  release:
    name: GoReleaser
    needs: [ci, build-darwin-tray]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # full history for changelog generation

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/ui/web/package-lock.json

      - name: Build UI
        run: make build-ui

      - name: Install tray build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing libayatana-appindicator3-dev

      - name: Download macOS tray binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lerd-tray-darwin-*
          path: dist-tray

      # The previous tag is taken literally, and before a stable release stands
      # the last beta of its own cycle, so the notes would cover the beta run
      # rather than the release. A beta keeps the default: what came before it
      # is what its testers last had.
      - name: Compare a stable release against the last stable tag
        if: ${{ !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-rc') }}
        run: |
          # Version sort puts a prerelease above the release it belongs to, so
          # the previous stable is the first tag carrying no dash that is not
          # this one, rather than whatever sits in second place.
          previous=$(git tag -l 'v*' --sort=-v:refname | awk -v t="${{ github.ref_name }}" '!/-/ && $0 != t' | head -1)
          if [ -n "$previous" ]; then
            echo "Comparing ${{ github.ref_name }} against $previous"
            echo "GORELEASER_PREVIOUS_TAG=$previous" >> "$GITHUB_ENV"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Announce on Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: .github/scripts/discord-release.sh "${{ github.ref_name }}"
