name: Docs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Copy static assets into public
        run: |
          mkdir -p docs/public/assets/screenshots
          cp screenshots/app-*.png docs/public/assets/screenshots/
          cp install.sh docs/public/install.sh
          cp install.ps1 docs/public/install.ps1
          mkdir -p docs/public/icons
          cp docs/public/assets/logo.svg docs/public/icons/icon.svg
          cp docs/public/assets/logo-dark.svg docs/public/icons/icon-dark.svg

      - name: Build the embedded UI demo
        working-directory: internal/ui/web
        run: |
          npm ci
          npm run build:demo

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build
        working-directory: docs
        run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

  # Tells Bing and the other IndexNow engines which pages changed since the
  # last stable release. A manual run has no previous tag to diff against.
  indexnow:
    if: ${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Submit changed pages
        run: |
          prev=$(git describe --tags --abbrev=0 --exclude='*-*' "${GITHUB_REF_NAME}^")
          git diff --name-only "$prev" "$GITHUB_REF_NAME" -- docs | node docs/scripts/indexnow.mjs
