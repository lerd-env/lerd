name: Contributor Review

# pull_request_target so fork PRs can read the token secret; checkout stays on the base branch.
on:
  pull_request_target:
    branches: ["main", "release/**"]
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: read
  contents: read

jobs:
  request:
    name: Request contributors review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Requested as reviewers, not code owners, so a contributor approval never satisfies the code owner gate.
      - name: Request review from lerd-env/contributors
        env:
          GH_TOKEN: ${{ secrets.CONTRIBUTOR_REVIEW_TOKEN }}
        run: python3 .github/scripts/contributor_review.py
