name: Check Upstream PHP Updates

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No saved state: the published base image is the record of what it was
      # built from. The Actions cache used to hold the last seen digests, but
      # the base image build evicts it, which turned every run into a rebuild.
      - name: Compare upstream layers with the published base images
        id: compare
        run: python3 .github/scripts/upstream_php.py

      - name: Trigger base image rebuild
        if: steps.compare.outputs.changed != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'base-images.yml',
              ref: 'main',
              inputs: {
                force_rebuild: 'true',
                versions: '${{ steps.compare.outputs.changed }}'
              }
            });
