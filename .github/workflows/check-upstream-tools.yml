name: Check Upstream Tool Releases

# Daily check of the host tools lerd pins in tools.yaml. Where the PHP image
# check auto-rebuilds artifacts, the pins live in tools.yaml, so a stale pin
# becomes a bump PR; merging it publishes the new pins to every install through
# the fetched manifest, no binary release needed.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # Pins that carry digests (and sizes) are checked against them on
      # download, so the script recomputes them for every version it moves.
      - name: Bump pinned tool versions
        run: |
          python3 .github/scripts/bump_tool_pins.py
          git diff --stat

      - name: Verify the pinned URLs resolve
        run: |
          set -euo pipefail
          FILE=internal/tools/tools.yaml
          for tool in $(yq -r '.tools | keys | .[]' "$FILE"); do
            version=$(yq -r ".tools.\"${tool}\".version" "$FILE")
            url=$(yq -r ".tools.\"${tool}\".url" "$FILE")
            asset=$(yq -r ".tools.\"${tool}\".assets.\"linux/amd64\" // \"\"" "$FILE")
            asset="${asset//\{version\}/$version}"
            url="${url//\{version\}/$version}"
            url="${url//\{asset\}/$asset}"
            echo "Checking ${tool}: ${url}"
            curl -fsSLI -o /dev/null "$url"
          done

      - name: Open bump PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/bump-tool-pins
          commit-message: 'chore: bump pinned host tool versions'
          title: 'chore: bump pinned host tool versions'
          body: 'Automated bump of the host tool pins in internal/tools/tools.yaml to the current upstream releases. The resolved download URLs were verified to exist, and the digests and sizes of every bumped pin were recomputed from the downloaded files, before this PR was opened. Merging publishes the new pins to every install through the fetched manifest, and the embedded fallback ships with the next release.'
