name = "lerd-uninstall-feedback"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "feedback.lerd.sh", custom_domain = true }]

# The request log would hold the addresses we promise not to keep.
[observability]
enabled = false

# 5 answers a minute per address is far more than one uninstall sends.
[[ratelimits]]
name = "LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "lerd-uninstall-feedback"
database_id = "329fe4ff-f4c9-47b5-98a8-b7ed1fbf144b"
migrations_dir = "migrations"
