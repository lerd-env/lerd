<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Lerd · share image</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ---- Tokens lifted from the landing page ---- */
      :root {
        --bg: #161616; /* the app's card and header grey, lerd theme */
        --rule: #262626; /* the app's border colour */
        --bg-2: #0e0e10;
        --panel: #131316;
        --line: #26262c;
        --line-2: #34343c;
        --ink: #f4f4f5;
        --ink-2: #c4c4cc;
        --muted: #8b8b95;
        --accent: #ff2d20;
        --accent-2: #ff5b50;
        --accent-glow: rgba(255, 45, 32, 0.45);
        --accent-wash: rgba(255, 45, 32, 0.16);
        --sans: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", "Cascadia Code", monospace;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: #050506;
        display: grid;
        place-items: center;
        min-height: 100vh;
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* The screenshot target: a fixed 1200x630 (1.91:1) OG frame. */
      .frame {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
      }

      /* Featured-article variant: the same composition on a 2:1 frame, shot at
         2x for 2200x1100. Add ?featured to the URL, or the class from a
         capture script. The window keeps its size and re-centres on the
         shorter frame, so only the vertical breathing room changes. */
      .frame.featured { height: 600px; }

      /* ---- Left: brand + headline + sub ---- */
      .copy {
        position: absolute;
        z-index: 3;
        left: 76px;
        top: 0;
        bottom: 0;
        width: 510px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .label {
        display: flex;
        align-items: center;
        gap: 12px;
        font: 500 14px/1 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .label img { width: 28px; height: 28px; display: block; }
      /* A ruled frame inset from the edge and a red bar along the foot. */
      .frame::before { content: ""; position: absolute; inset: 28px; border: 1px solid var(--rule); z-index: 2; pointer-events: none; }
      .frame::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: var(--accent); z-index: 4; }
      h1 {
        color: var(--accent);
        margin: 26px 0 0;
        font-weight: 700;
        font-size: 132px;
        line-height: 0.95;
        letter-spacing: -0.04em;
      }
      h1 span {
        display: block;
        margin-top: 0.22em;
        font-size: 0.33em;
        line-height: 1.08;
        letter-spacing: -0.03em;
        color: #f4f4f5;
      }
      .sub {
        margin: 30px 0 0;
        font: 15px/1 var(--mono);
        color: var(--muted);
      }

      /* ---- Right: the dashboard demo, bleeding off and fading to dark ---- */
      /* Everything outside the frame line is cropped, so the frame is the window's edge. */
      .stage { position: absolute; inset: 28px; overflow: hidden; z-index: 1; }
      .shot {
        position: absolute;
        top: 50%;
        right: -116px; /* the same spot as before the crop: left edge at 588px */
        transform: translateY(-50%);
        width: 700px;
        height: 420px;
        border: 1px solid #262626;
        border-radius: 16px;
        background: #0d0d0d;
        overflow: hidden;
        box-shadow: 0 20px 50px -24px rgba(0, 0, 0, 0.45);
      }
      .shot-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 22px;
        padding: 0 10px;
        background: #161616;
      }
      .dots { display: flex; gap: 5px; }
      .dots i { width: 6px; height: 6px; border-radius: 50%; display: block; }
      .dots i:nth-child(1) { background: #ff5f57; }
      .dots i:nth-child(2) { background: #febc2e; }
      .dots i:nth-child(3) { background: #28c840; }
      .shot-body { position: relative; height: calc(100% - 22px); overflow: hidden; }
      /* Render the demo at a wide logical viewport, then scale it down so the
         full desktop dashboard fits inside the window chrome. */
      .shot-body img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: left top; }

    </style>
  </head>
  <body>
    <div class="frame">
      <!-- the dashboard, cropped at the frame line -->
      <div class="stage">
      <div class="shot">
        <div class="shot-bar">
          <span class="dots"><i></i><i></i><i></i></span>
        </div>
        <div class="shot-body">
          <img src="/assets/landing/dashboard.png" alt="" />
        </div>
      </div>
      </div>

      <!-- brand + message -->
      <div class="copy">
        <div class="label"><img src="/assets/logo.svg" alt="" /><span>Open source, rootless, no Docker</span></div>
        <h1>Lerd <span>Local PHP development for Linux and macOS</span></h1>
        <p class="sub">lerd.sh</p>
      </div>
    </div>
    <script>
      if (location.search.includes('featured')) {
        document.querySelector('.frame').classList.add('featured');
      }
    </script>
  </body>
</html>
